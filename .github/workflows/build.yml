name: Build VST3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vst3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VST3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LYNX-Tuner-VST3-windows-x64
            build_args: --config Release
            artifact_path: build/LynxTuner_artefacts/Release/VST3/LYNX Tuner.vst3
          - os: ubuntu-24.04
            artifact: LYNX-Tuner-VST3-linux-x64
            build_args: --config Release
            artifact_path: build/LynxTuner_artefacts/Release/VST3/LYNX Tuner.vst3
          - os: macos-15
            artifact: LYNX-Tuner-VST3-macos
            build_args: --config Release
            artifact_path: build/LynxTuner_artefacts/Release/VST3/LYNX Tuner.vst3

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Windows' && '-A x64' || '' }}

      - name: Build VST3
        run: cmake --build build --config Release --target LynxTuner_VST3 --parallel 2

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 6
